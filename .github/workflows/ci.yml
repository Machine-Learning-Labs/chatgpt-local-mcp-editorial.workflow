name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag is a comment for humans and Dependabot).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/pytest --cov --cov-report=term-missing:skip-covered

  audit:
    # Known vulnerabilities in the pinned sets: the project (uv.lock) and the scribus-mcp
    # runtime that runs on the owner's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv export --frozen --all-extras --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt
      - run: uvx pip-audit --no-deps --disable-pip -r containers/scribus-mcp/requirements.txt

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x bin/*
      - name: compose config renders
        run: |
          printf 'GATEWAY_SECRET=%s\nGATEWAY_OWNER_PASSWORD=x\nNGROK_AUTHTOKEN=x\nEDITORIAL_ROOT=/tmp/Editorial\nASSETS_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > ci.env
          for mode in host container; do
            sed -i '/^MCP_MODE=/d' ci.env && echo "MCP_MODE=$mode" >> ci.env
            ENV_FILE=ci.env bin/compose config -q
          done

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f containers/gateway/Containerfile -t gateway .
      - run: docker build -f containers/scribus-mcp/Containerfile -t scribus-mcp .
      - run: docker build -f containers/assets/Containerfile -t assets .
      - name: scribus-mcp answers initialize
        run: |
          docker run -d --name smcp -p 127.0.0.1:8000:8000 scribus-mcp
          for i in $(seq 30); do curl -s -o /dev/null localhost:8000/mcp && break; sleep 1; done
          curl -fsS -X POST localhost:8000/mcp -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q serverInfo
