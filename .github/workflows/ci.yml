name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/pytest --cov --cov-report=term-missing:skip-covered

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/*
      - name: compose config renders
        run: |
          printf 'GATEWAY_SECRET=%s\nGATEWAY_OWNER_PASSWORD=x\nNGROK_AUTHTOKEN=x\n' "$(openssl rand -hex 32)" > ci.env
          ENV_FILE=ci.env bin/compose config -q

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f containers/gateway/Containerfile -t gateway .
      - run: docker build -f containers/scribus-mcp/Containerfile -t scribus-mcp .
      - name: scribus-mcp answers initialize
        run: |
          docker run -d --name smcp -p 127.0.0.1:8000:8000 scribus-mcp
          for i in $(seq 30); do curl -s -o /dev/null localhost:8000/mcp && break; sleep 1; done
          curl -fsS -X POST localhost:8000/mcp -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q serverInfo
