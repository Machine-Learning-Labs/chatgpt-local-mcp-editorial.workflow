# Keeps the pinned sets fresh: uv.lock, the scribus-mcp runtime pins, the base images,
# and the SHA-pinned actions. Each update still goes through CI (tests + pip-audit).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mcp 2.x removed mcp.server.fastmcp, which scribus-mcp 1.3.x and
      # src/editorial_assets import. Stay on 1.x until both move.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/containers/scribus-mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    # mcp-proxy, the DesignCraft bridge (bin/designcraft-service). Re-pin with make lock.
    directory: "/containers/designcraft-mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/containers/gateway"
      - "/containers/assets"
      - "/containers/scribus-mcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
