[project]
name = "mcp-oauth-gateway"
version = "0.2.0"
description = "OAuth 2.1 gateway that publishes a local MCP server (Scribus) through ngrok with a single command."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "editorial.workflow contributors" }]
keywords = ["mcp", "oauth", "scribus", "ngrok", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# starlette >= 1.6: per-route max_body_size (chunked bodies), and the urlencoded form
# limits fixed in 1.3.1 (CVE-2026-54283). python-multipart backs request.form().
dependencies = [
  "starlette>=1.6",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Editorial Assets MCP server (images → editorial folder). mcp<2 matches scribus-mcp's line.
assets = [
  "mcp>=1.25,<2",
  "pillow>=10.4",
]
dev = [
  "mcp>=1.25,<2",
  "pillow>=10.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
mcp-oauth-gateway = "mcp_oauth_gateway.cli:main"
editorial-assets = "editorial_assets.cli:main"

[project.urls]
Homepage = "https://github.com/Machine-Learning-Labs/chatgpt-local-mcp-editorial.workflow"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oauth_gateway", "src/editorial_assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["mcp_oauth_gateway", "editorial_assets"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/mcp_oauth_gateway/pages.py" = ["E501"]
