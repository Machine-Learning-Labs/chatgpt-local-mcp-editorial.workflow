# editorial.workflow — Scribus MCP (caewa/scribus-mcp) published over HTTPS with OAuth 2.1.
#
#   internet ──ngrok──▶ gateway:8080 (OAuth 2.1 + bearer check + tool policy) ─┬▶ /editor/mcp → scribus-mcp
#                                                                              └▶ /assets/mcp → assets
#
# Works with `docker compose` and `podman compose` / `podman-compose`.
# Use `make up` (bin/up) rather than calling compose directly: it prepares .env, picks the
# compose files for MCP_MODE (host mode adds docker-compose.host.yml) and prints URL + token.
#
# EDITORIAL_ROOT is mounted at the SAME absolute path everywhere, so a path means the same
# thing to ChatGPT, the gateway's path jail, scribus-mcp and your desktop Scribus.

name: editorial-workflow

services:
  gateway:
    build:
      context: .
      dockerfile: containers/gateway/Containerfile
    image: localhost/editorial-workflow/gateway:dev
    restart: unless-stopped
    # Set by bin/lib.sh so the gateway can resolve paths in EDITORIAL_ROOT (docker/podman).
    user: "${CONTAINER_USER:-10001:10001}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Resource caps: a flood of requests cannot take the machine down with the service.
    mem_limit: 512m
    pids_limit: 256
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?run bin/setup first}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:-}
      GATEWAY_AUTO_APPROVE: ${GATEWAY_AUTO_APPROVE:-false}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-*}
      GATEWAY_ALLOWED_REDIRECTS: ${GATEWAY_ALLOWED_REDIRECTS:-https://chatgpt.com/,https://claude.ai/,https://claude.com/,http://localhost,http://127.0.0.1}
      GATEWAY_ALLOWED_CLIENT_CIDRS: ${GATEWAY_ALLOWED_CLIENT_CIDRS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://scribus-mcp:8000/mcp}
      UPSTREAM_HOST_HEADER: ${UPSTREAM_HOST_HEADER:-localhost:8000}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-3600}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      POLICY_ROOT: ${EDITORIAL_ROOT:?set EDITORIAL_ROOT in .env (bin/setup)}
      POLICY_DENY_TOOLS: ${POLICY_DENY_TOOLS:-run_script,install_custom_font,set_js_action,create_pdf_push_button}
      POLICY_ALLOW_TOOLS: ${POLICY_ALLOW_TOOLS:-}
      # Second connector: Editorial Assets at /assets/mcp (+ /upload/<token> links).
      ASSETS_UPSTREAM_URL: http://assets:8766/mcp
      ASSETS_UPSTREAM_HOST_HEADER: localhost:8766
      ASSETS_MAX_UPLOAD_BYTES: ${ASSETS_MAX_UPLOAD_BYTES:-32505856}
    volumes:
      # Read-only: the gateway only resolves symlinks for the path jail.
      - ${EDITORIAL_ROOT}:${EDITORIAL_ROOT}:ro,z
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  scribus-mcp:
    profiles: ["container"]
    build:
      context: .
      dockerfile: containers/scribus-mcp/Containerfile
      args:
        SCRIBUS_MCP_VERSION: ${SCRIBUS_MCP_VERSION:-1.3.1}
    image: localhost/editorial-workflow/scribus-mcp:${SCRIBUS_MCP_VERSION:-1.3.1}
    restart: unless-stopped
    user: "${CONTAINER_USER:-10001:10001}"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    working_dir: ${EDITORIAL_ROOT}
    environment:
      HOME: /tmp/scribus-home
      SCRIBUS_MCP_RUN_SCRIPT: "0"
      SCRIBUS_MCP_LOG_LEVEL: ${SCRIBUS_MCP_LOG_LEVEL:-INFO}
    volumes:
      - ${EDITORIAL_ROOT}:${EDITORIAL_ROOT}:z
    # Not published on the host: only the gateway can reach it.
    expose:
      - "8000"

  assets:
    build:
      context: .
      dockerfile: containers/assets/Containerfile
    image: localhost/editorial-workflow/assets:dev
    restart: unless-stopped
    user: "${CONTAINER_USER:-10002:10002}"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Decoding one image at the 80 Mpx cap needs a few hundred MB; nothing more.
    mem_limit: 1g
    pids_limit: 128
    environment:
      EDITORIAL_ROOT: ${EDITORIAL_ROOT}
      ASSETS_SECRET: ${ASSETS_SECRET:?run bin/setup first}
      ASSETS_SUBDIR: ${ASSETS_SUBDIR:-libro/assets}
      ASSETS_DOWNLOAD_HOSTS: ${ASSETS_DOWNLOAD_HOSTS:-.oaiusercontent.com,.openai.com,.chatgpt.com}
      ASSETS_MAX_BYTES: ${ASSETS_MAX_BYTES:-31457280}
      ASSETS_HOST: 0.0.0.0
      ASSETS_PORT: "8766"
    volumes:
      # Read-write: the only place images are written to.
      - ${EDITORIAL_ROOT}:${EDITORIAL_ROOT}:z
      # Local time for the timestamps in file names.
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8766"

  ngrok:
    # Major tag rather than :latest, so a rebuild cannot silently pull a different agent.
    image: ${NGROK_IMAGE:-docker.io/ngrok/ngrok:3}
    restart: unless-stopped
    depends_on:
      - gateway
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    mem_limit: 256m
    pids_limit: 64
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env (bin/setup imports it from ngrok config)}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_UPSTREAM: http://gateway:8080
      NGROK_WEB_ADDR: 0.0.0.0:4040
    entrypoint: ["/bin/sh", "-c"]
    # --inspect=false: the agent's traffic inspector would otherwise keep every request,
    # bearer tokens and the consent password included, readable on the web_addr API with
    # no authentication. The API itself stays up (bin/lib.sh reads /api/tunnels).
    command:
      - >-
        printf 'version: "2"\nweb_addr: %s\n' "$$NGROK_WEB_ADDR" > /tmp/ngrok.yml &&
        exec ngrok http "$$NGROK_UPSTREAM" --config /tmp/ngrok.yml --inspect=false
        --log stdout --log-format logfmt
        $${NGROK_DOMAIN:+--url=https://$$NGROK_DOMAIN}
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"
